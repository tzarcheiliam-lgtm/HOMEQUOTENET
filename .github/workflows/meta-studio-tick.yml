# Meta Ads Studio worker, hourly: (1) reads live campaign/ad-set state (budgets, learning status, Ads Manager edits) and
# (2) evaluates enabled optimization rules. Everything it can do to Meta is behind the Studio switches (live writes OFF,
# automation stopped, and rules disabled by default), so on a fresh install this only records evaluations.
#
# Setup (once): same META_TICK_SECRET as meta-tick.yml, plus
#   GitHub -> Settings -> Secrets and variables -> Actions:
#     META_STUDIO_TICK_URL = https://<production domain>/api/meta/studio-tick
# Until both secrets exist the job skips without failing.
name: Meta Studio tick

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: meta-studio-tick
  cancel-in-progress: false

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/meta/studio-tick
        env:
          TICK_URL: ${{ secrets.META_STUDIO_TICK_URL }}
          CRON_SECRET: ${{ secrets.META_TICK_SECRET }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "META_STUDIO_TICK_URL / META_TICK_SECRET not configured; skipping."
            exit 0
          fi
          code=$(curl -sS --max-time 150 -o body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$TICK_URL")
          echo "HTTP $code"; cat body.json; echo
          [ "$code" = "200" ]
