# Durable workflow scheduler: dispatches workflow events, resumes waits and
# runs retries by calling POST /api/workflows/tick every 5 minutes.
#
# GitHub Actions instead of Vercel Cron: works on any Vercel plan (Hobby only
# allows daily crons) and can never fail a deploy. GitHub runs scheduled jobs
# best-effort (can lag a few minutes) — fine for waits measured in minutes+.
#
# Setup (once):
#   1. Vercel → Project → Settings → Environment Variables (Production):
#        WORKFLOW_CRON_SECRET = <long random string>
#   2. GitHub → repo → Settings → Secrets and variables → Actions:
#        WORKFLOW_CRON_SECRET = <the same string>
#        WORKFLOW_TICK_URL    = https://<production domain>/api/workflows/tick
# Until both secrets exist the job skips without failing.
name: Workflow tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Overlapping ticks are safe (claims use FOR UPDATE SKIP LOCKED), but there is
# no reason to queue them.
concurrency:
  group: workflow-tick
  cancel-in-progress: false

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/workflows/tick
        env:
          TICK_URL: ${{ secrets.WORKFLOW_TICK_URL }}
          CRON_SECRET: ${{ secrets.WORKFLOW_CRON_SECRET }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "WORKFLOW_TICK_URL / WORKFLOW_CRON_SECRET not configured; skipping."
            exit 0
          fi
          code=$(curl -sS --max-time 90 -o body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$TICK_URL")
          echo "HTTP $code"; cat body.json; echo
          # 200 = clean, 207 = processed with some failures (see workflow logs).
          [ "$code" = "200" ] || [ "$code" = "207" ]
