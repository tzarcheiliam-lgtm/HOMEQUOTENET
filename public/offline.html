<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offline · HomeQuote</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#111;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom)}
  main{max-width:22rem;text-align:center}
  h1{font-size:1.25rem;margin:0 0 .5rem}
  p{color:#555;margin:0 0 1.25rem;line-height:1.45}
  button{min-height:48px;padding:0 24px;border-radius:10px;border:0;background:#18181b;color:#fff;font-size:1rem;font-weight:600}
  @media (prefers-color-scheme:dark){body{background:#0a0a0f;color:#f4f4f5}p{color:#a1a1aa}button{background:#f4f4f5;color:#18181b}}
</style>
</head>
<body>
<main>
  <h1>You&rsquo;re offline</h1>
  <p>HomeQuote needs a connection to show your latest leads and appointments. You&rsquo;re still signed in &mdash; reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
